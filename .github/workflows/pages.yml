name: GitHub Pages

# 文档站（docs-site）占项目页根路径；时光机（apps/web）挂在 /time-machine/。
# 两站独立构建，合并进同一个 Pages artifact。旧的 /docs/ 地址由静态 HTML 跳到去掉该前缀后的新路径。
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'docs-site/**'
      - 'packages/*/README.md'
      - 'docs/**'
      - 'patches/**'
      - '.github/workflows/pages.yml'
      - 'scripts/pages-docs-redirect.mjs'
      - 'scripts/docs-home-data.mjs'
      - 'scripts/count-release-snapshots.mjs'
      - 'scripts/data/release-level-counts.json'
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署
concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://tonyc726.github.io/china-administrative-division

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs-site 的 lastUpdated 需要完整 git 历史

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      # apps/web 的 build-data.ts 直接读 packages/source-*/data/divisions.csv（monorepo 相对路径）。
      # 这两个 CSV 体积大，仓库里 gitignore 掉了，CI 无法本地重新生成——改从已发布的 npm 包里取，
      # 这正是 @cndiv/source-2023 / @cndiv/source-history 存在的意义（唯一可复现的数据源）。
      # composite action 同时做 manifest SHA-512 复核，与 ci.yml 的 verify 门禁共用。
      - uses: ./.github/actions/fetch-data-csvs

      # apps/web 是嵌套 workspace（自有 lockfile，不进 monorepo）。
      # 项目页前缀之后再加 /time-machine/，把根路径留给文档站。
      - name: Build web (time machine)
        working-directory: apps/web
        env:
          WEB_BASE: /china-administrative-division/time-machine/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # docs-site 是嵌套 workspace（自有 pnpm-workspace.yaml + allowBuilds.esbuild），
      # 不要加 --ignore-workspace，否则 pnpm 11 会忽略 allowBuilds 并因 esbuild 脚本未放行而失败。
      - name: Build docs-site (site root)
        working-directory: docs-site
        env:
          DOCS_BASE: /china-administrative-division/
          DOCS_SITE_URL: ${{ env.SITE_URL }}
          DOCS_HOME_URL: ${{ env.SITE_URL }}/time-machine/
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Combine into one Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist/time-machine
          cp -r docs-site/.vitepress/dist/. dist/
          cp -r apps/web/dist/. dist/time-machine/
          node scripts/pages-docs-redirect.mjs dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
