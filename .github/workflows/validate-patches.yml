name: Validate Patches

on:
  pull_request:
    paths:
      - 'patches/**/*.json'

jobs:
  validate-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @cn-division/core --filter @cn-division/data-protocol build

      - name: Validate patch files
        run: node scripts/validate-patches.mjs
