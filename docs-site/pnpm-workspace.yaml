# Nested workspace: keeps VitePress deps out of the monorepo lockfile.
# CI/local run `pnpm install` here (do not pass --ignore-workspace, or allowBuilds is ignored).
packages:
  - '.'

# 与根 workspace 安全 overrides 同步（仅前端依赖链路命中的条目；见根 pnpm-workspace.yaml）。
# vite：vitepress 1.6.4 默认解析 vite 5.4.21（esbuild 0.21.5），均在
# GHSA-fx2h-pf6j-xcff / GHSA-67mh-4wv8-2f99 漏洞范围内；强制 vite ^6.4.3，
# 其自带 esbuild >=0.25 已含补丁（vitepress 1.6.x 兼容 vite 6，构建验证后方合入）。
overrides:
  brace-expansion: ^5.0.12
  nanoid@3: ^3.3.18
  postcss: ^8.5.26
  vite: ^6.4.3

allowBuilds:
  esbuild: true
