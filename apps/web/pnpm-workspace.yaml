# Nested workspace: keeps React/Vite deps out of the monorepo lockfile.
# CI/local run `pnpm install` here (do not pass --ignore-workspace).
packages:
  - '.'

# pnpm 11 默认 minimumReleaseAge 为 1440 分钟。react / react-dom 19.3.1
# 发布于 2026-10-14，安装时须点名放行。安全 overrides 仍与根 workspace 对齐。
minimumReleaseAgeExclude:
  - react-dom@19.3.1
  - react@19.3.1

# 与根 workspace 安全 overrides 同步（仅前端依赖链路命中的条目；见根 pnpm-workspace.yaml）。
overrides:
  brace-expansion: ^5.0.12
  nanoid@3: ^3.3.18
  postcss: ^8.5.26
  source-map-js: ^1.2.2
