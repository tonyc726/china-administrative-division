# Nested workspace: keeps React/Vite deps out of the monorepo lockfile.
# CI/local run `pnpm install` here (do not pass --ignore-workspace).
packages:
  - '.'

# 与根 workspace 安全 overrides 同步（仅前端依赖链路命中的条目；见根 pnpm-workspace.yaml）。
overrides:
  brace-expansion: ^5.0.9
  nanoid@3: ^3.3.18
  postcss: ^8.5.26
